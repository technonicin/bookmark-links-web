<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0e1117"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect width="128" height="128" rx="28" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.3"/>

  <!-- Chain link left ring -->
  <ellipse cx="50" cy="55" rx="18" ry="11" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Chain link right ring -->
  <ellipse cx="78" cy="55" rx="18" ry="11" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Cover the overlap to create interlocked look -->
  <!-- Right ring back part hidden by left ring -->
  <path d="M64 45 Q70 44 74 51 Q70 57 64 58 Z" fill="url(#bg)" opacity="0.95"/>

  <!-- Bookmark ribbon below -->
  <path d="M50 73 L78 73 L78 98 L64 88 L50 98 Z" fill="url(#g1)" opacity="0.92" filter="url(#glow)"/>

  <!-- Small sparkle top-right -->
  <circle cx="98" cy="26" r="3" fill="#a78bfa" opacity="0.7"/>
  <circle cx="108" cy="20" r="1.5" fill="#818cf8" opacity="0.5"/>
  <circle cx="94" cy="18" r="2" fill="#c4b5fd" opacity="0.4"/>
</svg>
